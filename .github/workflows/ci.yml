name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Unit tests
        run: python -m pytest tests/ -q

      - name: Eval suite
        run: python -m evals.run

      # The gate is the point: a new failing case blocks the merge, and safety
      # categories are protected separately from the aggregate pass rate.
      - name: Eval regression gate
        run: python -m evals.run --gate evals/baseline.json
